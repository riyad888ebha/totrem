<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Riyad AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #212121;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: #171717;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px;
        }

        .new-chat {
            background: #2f2f2f;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .new-chat:hover {
            background: #3a3a3a;
        }

        .history {
            flex: 1;
            overflow-y: auto;
        }

        .history-title {
            color: #999;
            font-size: 13px;
            padding: 10px;
        }

        .history-item {
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: #ddd;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #2a2a2a;
        }

        .sidebar-bottom {
            color: #aaa;
            padding: 10px;
            font-size: 13px;
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px 15%;
        }

        .welcome {
            text-align: center;
            margin-top: 100px;
        }

        .welcome h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .welcome p {
            color: #aaa;
        }

        .message {
            margin-bottom: 25px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: #303030;
        }

        .message.ai .bubble {
            background: transparent;
        }

        /* INPUT */
        .input-area {
            padding: 15px 15%;
            border-top: 1px solid #333;
        }

        .input-box {
            display: flex;
            background: #2f2f2f;
            border: 1px solid #555;
            border-radius: 14px;
            padding: 8px;
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 10px;
            font-size: 16px;
        }

        #sendButton {
            width: 45px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            cursor: pointer;
            font-size: 18px;
        }

        #sendButton:hover {
            background: #ddd;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .chat {
                padding: 25px;
            }

            .input-area {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            🤖 Riyad AI
        </div>

        <button class="new-chat" onclick="newChat()">
            + Nieuwe chat
        </button>

        <div class="history">
            <div class="history-title">
                Recente chats
            </div>

            <div id="historyList"></div>
        </div>

        <div class="sidebar-bottom">
            Riyad AI © 2026
        </div>

    </aside>


    <main class="main">

        <div class="topbar">
            Riyad AI
        </div>

        <div class="chat" id="chat">

            <div class="welcome" id="welcome">
                <h1>Hallo 👋</h1>
                <p>Waar kan ik je mee helpen?</p>
            </div>

        </div>


        <div class="input-area">

            <div class="input-box">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Stuur een bericht naar Riyad AI..."
                    autocomplete="off"
                >

                <button id="sendButton">
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<script>

    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const historyList = document.getElementById("historyList");

    let messages = [];


    function addMessage(text, type) {

        if (welcome) {
            welcome.style.display = "none";
        }

        const message = document.createElement("div");

        message.className = "message " + type;

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = text;

        message.appendChild(bubble);

        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;
    }


    function sendMessage() {

        const text = input.value.trim();

        if (text === "") {
            return;
        }

        addMessage(text, "user");

        messages.push({
            user: text
        });

        addHistory(text);

        input.value = "";

        // Demo AI antwoord
        setTimeout(() => {

            let answer =
                "Ik ben Riyad AI 🤖\n\n" +
                "Je bericht is ontvangen: \"" +
                text +
                "\"\n\n" +
                "Dit is momenteel een demo. Voor echte AI-antwoorden moet er nog een AI-backend aan gekoppeld worden.";

            addMessage(answer, "ai");

        }, 600);
    }


    function addHistory(text) {

        const item = document.createElement("div");

        item.className = "history-item";

        item.textContent = text;

        historyList.prepend(item);
    }


    function newChat() {

        chat.innerHTML = "";

        const newWelcome = document.createElement("div");

        newWelcome.className = "welcome";

        newWelcome.innerHTML = `
            <h1>Nieuwe chat 👋</h1>
            <p>Waar wil je het over hebben?</p>
        `;

        chat.appendChild(newWelcome);

        input.focus();
    }


    sendButton.addEventListener("click", sendMessage);


    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

</script>

</body>
</html>
