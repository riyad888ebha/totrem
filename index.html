```html
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiyadGPT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #212121;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: #171717;
    border-right: 1px solid #333;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    padding: 10px;
    margin-bottom: 12px;
}

.new-chat {
    background: #252525;
    color: white;
    border: 1px solid #444;
    border-radius: 9px;
    padding: 13px;
    cursor: pointer;
    font-size: 15px;
    text-align: left;
}

.new-chat:hover {
    background: #333;
}

.history-title {
    color: #888;
    font-size: 11px;
    margin: 25px 8px 10px;
}

.history {
    overflow-y: auto;
}

.history-item {
    padding: 10px;
    border-radius: 7px;
    margin-bottom: 3px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-item:hover {
    background: #292929;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 60px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    padding: 0 22px;
    font-size: 18px;
    font-weight: bold;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 35px 12%;
}

/* WELCOME */

.welcome {
    min-height: 75%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

.logo-big {
    width: 75px;
    height: 75px;
    background: #10a37f;
    border-radius: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 20px;
}

.welcome h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

.welcome p {
    color: #999;
}

/* MESSAGES */

.message {
    display: flex;
    gap: 14px;
    margin-bottom: 28px;
    line-height: 1.7;
}

.avatar {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 11px;
    background: #10a37f;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

.user .avatar {
    background: #555;
}

.message-content {
    max-width: 900px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.typing {
    color: #999;
}

/* INPUT */

.input-area {
    padding: 15px 12% 25px;
}

.input-box {
    display: flex;
    align-items: flex-end;
    background: #2f2f2f;
    border: 1px solid #555;
    border-radius: 16px;
    padding: 8px;
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
    padding: 11px;
    line-height: 1.5;
    max-height: 180px;
}

textarea::placeholder {
    color: #999;
}

.send {
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 11px;
    background: white;
    color: black;
    font-size: 21px;
    cursor: pointer;
    font-weight: bold;
}

.send:hover {
    background: #ddd;
}

.send:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.status {
    text-align: center;
    color: #777;
    font-size: 11px;
    margin-top: 8px;
}

/* MOBILE */

@media(max-width: 700px) {

    .sidebar {
        display: none;
    }

    .chat {
        padding: 20px;
    }

    .input-area {
        padding: 10px;
    }

    .welcome h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            🤖 RiyadGPT
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ Nieuwe chat
        </button>

        <div class="history-title">
            GESPREKKEN
        </div>

        <div class="history" id="history"></div>

    </aside>


    <main class="main">

        <header class="topbar">
            🤖 RiyadGPT
        </header>


        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="logo-big">
                    R
                </div>

                <h1>
                    Hallo, ik ben RiyadGPT
                </h1>

                <p>
                    Stel mij een vraag.
                </p>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    rows="1"
                    placeholder="Bericht aan RiyadGPT..."
                ></textarea>

                <button
                    class="send"
                    id="send"
                    onclick="sendMessage()"
                >
                    ↑
                </button>

            </div>

            <div class="status">
                RiyadGPT • Groq AI
            </div>

        </div>

    </main>

</div>


<script>

/*
====================================================
🔑 PLAK HIER JE NIEUWE GROQ API KEY
====================================================

Voorbeeld:

const GROQ_API_KEY = "gsk_xxxxxxxxxxxxx";

Plak je nieuwe key tussen de aanhalingstekens.
====================================================
*/

const GROQ_API_KEY = "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";


/*
====================================================
MODEL
====================================================
*/

const MODEL = "llama-3.3-70b-versatile";


/*
====================================================
SYSTEEMINSTRUCTIE
====================================================
*/

const SYSTEM_MESSAGE = `
Je bent RiyadGPT, een vriendelijke en slimme AI-assistent.

- Antwoord in dezelfde taal als de gebruiker.
- Wees behulpzaam en duidelijk.
- Geef uitleg wanneer dat nodig is.
- Gebruik normale tekst.
- Verzin geen informatie als je iets niet weet.
`;


/*
====================================================
ELEMENTEN
====================================================
*/

const input = document.getElementById("input");
const chat = document.getElementById("chat");
const sendButton = document.getElementById("send");
const history = document.getElementById("history");


/*
====================================================
BERICHTEN
====================================================
*/

let messages = [];


/*
====================================================
ENTER = VERSTUREN
====================================================
*/

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();
    }

});


/*
====================================================
TEXTAREA GROTER MAKEN
====================================================
*/

input.addEventListener("input", function() {

    this.style.height = "auto";

    this.style.height =
        Math.min(this.scrollHeight, 180) + "px";

});


/*
====================================================
BERICHT TOEVOEGEN
====================================================
*/

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        type === "user" ? "J" : "R";


    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent =
        text;


    message.appendChild(avatar);
    message.appendChild(content);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/*
====================================================
TYPING
====================================================
*/

function showTyping() {

    const typing =
        document.createElement("div");

    typing.className =
        "message bot";

    typing.id =
        "typing";

    typing.innerHTML = `
        <div class="avatar">R</div>
        <div class="message-content typing">
            RiyadGPT is aan het typen...
        </div>
    `;

    chat.appendChild(typing);

    chat.scrollTop =
        chat.scrollHeight;
}


function removeTyping() {

    const typing =
        document.getElementById("typing");

    if (typing) {
        typing.remove();
    }
}


/*
====================================================
GROQ AANROEPEN
====================================================
*/

async function askRiyadGPT() {

    const response =
        await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization":
                        "Bearer " + GROQ_API_KEY
                },

                body: JSON.stringify({

                    model: MODEL,

                    messages: [
                        {
                            role: "system",
                            content: SYSTEM_MESSAGE
                        },
                        ...messages
                    ],

                    temperature: 0.7,

                    max_tokens: 2048
                })
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data?.error?.message ||
            "Groq gaf een fout."
        );
    }


    const answer =
        data?.choices?.[0]?.message?.content;


    if (!answer) {

        throw new Error(
            "RiyadGPT heeft geen antwoord ontvangen."
        );
    }


    return answer;
}


/*
====================================================
BERICHT VERSTUREN
====================================================
*/

async function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    if (
        GROQ_API_KEY ===
        "PLAK_HIER_JE_NIEUWE_KEY"
    ) {

        alert(
            "Plak eerst je nieuwe Groq API-key bovenaan in de code."
        );

        return;
    }


    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    addMessage(
        text,
        "user"
    );


    messages.push({

        role: "user",

        content: text

    });


    addHistory(text);


    input.value = "";

    input.style.height = "auto";

    sendButton.disabled = true;


    showTyping();


    try {

        const answer =
            await askRiyadGPT();


        removeTyping();


        addMessage(
            answer,
            "bot"
        );


        messages.push({

            role: "assistant",

            content: answer

        });

    }

    catch (error) {

        removeTyping();


        addMessage(
            "❌ Fout:\n\n" + error.message,
            "bot"
        );

    }


    sendButton.disabled = false;

    input.focus();
}


/*
====================================================
GESCHIEDENIS
====================================================
*/

function addHistory(text) {

    const item =
        document.createElement("div");

    item.className =
        "history-item";

    item.textContent =
        text;

    history.prepend(item);
}


/*
====================================================
NIEUWE CHAT
====================================================
*/

function newChat() {

    messages = [];


    chat.innerHTML = `

        <div class="welcome" id="welcome">

            <div class="logo-big">
                R
            </div>

            <h1>
                Hallo, ik ben RiyadGPT
            </h1>

            <p>
                Stel mij een vraag.
            </p>

        </div>

    `;


    input.focus();
}


/*
====================================================
START
====================================================
*/

input.focus();

</script>

</body>
</html>
